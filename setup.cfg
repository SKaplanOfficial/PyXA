[metadata]
name = mac-pyxa
version = 0.3.0.1
author = Stephen Kaplan
author_email = stephen.kaplan@maine.edu
description = A package for accomplish AppleScript automation tasks using Python syntax.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/SKaplanOfficial/PyXA
project_urls =
    Bug Tracker = https://github.com/SKaplanOfficial/PyXA/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.11
install_requires = 
    pyobjc-core >= 12,<13
    pyobjc-framework-AVFoundation >= 12,<13
    pyobjc-framework-EventKit >= 12,<13
    pyobjc-framework-Quartz >= 12,<13
    pyobjc-framework-ScriptingBridge >= 12,<13
    pyobjc-framework-NaturalLanguage >= 12,<13
    pyobjc-framework-CoreLocation >= 12,<13
    pyobjc-framework-Vision >= 12,<13
    pyobjc-framework-CoreMedia >= 12,<13
    pyobjc-framework-Photos >= 12,<13
    pyobjc-framework-Speech >= 12,<13
    pyobjc-framework-LatentSemanticMapping >= 12,<13
    pyobjc-framework-ApplicationServices >= 12,<13
    pyobjc-framework-CoreText >= 12,<13
    pyobjc-framework-libdispatch >= 12,<13
    pyobjc-framework-datadetection >= 12,<13
    requests >= 2.31,<3
    beautifulsoup4 >= 4.12,<5
